name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'fitlog/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fitlog/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r fitlog/backend/requirements.txt

    - name: Lint and syntax check
      run: |
        python -m py_compile fitlog/backend/app/main.py

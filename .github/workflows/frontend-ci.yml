name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'fitlog/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fitlog/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fitlog/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: fitlog/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run build
      run: npm run build

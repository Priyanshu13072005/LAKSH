services:
  - type: web
    name: laksh-backend
    runtime: python
    rootDir: fitlog/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: laksh-db
          property: connectionString

databases:
  - name: laksh-db
    databaseName: laksh_db
    user: laksh_user
    plan: free
